<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="AONYX, a local-first AI assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AONYX, a local-first AI assistant</title>
<defs>
<linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#052a82" stop-opacity=".55"/><stop offset="1" stop-color="#031a52" stop-opacity=".9"/></linearGradient>
<linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#083fc3" stop-opacity=".05"/><stop offset=".5" stop-color="#083fc3" stop-opacity=".45"/><stop offset="1" stop-color="#083fc3" stop-opacity=".05"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2f6bff" stroke-opacity=".07"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b8cff"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3b4e"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#5b8cff"/></marker>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#083fc3" stop-opacity=".6"/><stop offset=".55" stop-color="#052a82" stop-opacity=".18"/><stop offset="1" stop-color="#010714" stop-opacity="0"/></radialGradient>
<linearGradient id="word" gradientUnits="userSpaceOnUse" x1="0" y1="130" x2="0" y2="240"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#9db9ff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient>
<linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b8cff" stop-opacity="0"/><stop offset="1" stop-color="#5b8cff"/></linearGradient>
<linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b8cff" stop-opacity="0"/><stop offset=".5" stop-color="#5b8cff" stop-opacity=".55"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect width="1200" height="380" rx="14"/></clipPath>
<style>
.flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
</style>
</defs>
<rect width="1200" height="380" rx="14" fill="#010714"/>
<rect width="1200" height="380" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="379" rx="14" fill="none" stroke="#083fc3" stroke-opacity=".55"/>
<g clip-path="url(#clip)">
<ellipse cx="600" cy="190" rx="560" ry="230" fill="url(#halo)"/>
<g transform="translate(600 190)">
<g><circle r="196" fill="none" stroke="#5b8cff" stroke-opacity=".28" stroke-width="7" stroke-dasharray="2 15"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/></g>
<g><circle r="168" fill="none" stroke="#2f6bff" stroke-opacity=".5" stroke-width="1.4" stroke-dasharray="70 26 10 26"/><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="60s" repeatCount="indefinite"/></g>
<circle r="140" fill="none" stroke="#2f6bff" stroke-opacity=".22"/>
<g><circle r="118" fill="none" stroke="#9db9ff" stroke-opacity=".35" stroke-width="1" stroke-dasharray="2 7"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></g>
</g>
<rect x="-40" y="0" width="40" height="380" fill="url(#sweep)" opacity=".5"><animateTransform attributeName="transform" type="translate" from="0 0" to="1280 0" dur="9s" repeatCount="indefinite"/></rect>
</g>
<path d="M26 60V26H60" fill="none" stroke="#2f6bff" stroke-opacity=".75" stroke-width="1.5"/>
<path d="M1174 60V26H1140" fill="none" stroke="#2f6bff" stroke-opacity=".75" stroke-width="1.5"/>
<path d="M26 320V354H60" fill="none" stroke="#2f6bff" stroke-opacity=".75" stroke-width="1.5"/>
<path d="M1174 320V354H1140" fill="none" stroke="#2f6bff" stroke-opacity=".75" stroke-width="1.5"/>
<text x="614" y="232" font-family="Orbitron, Rajdhani, 'Segoe UI', Arial, sans-serif" font-size="132" font-weight="800" fill="#5b8cff" text-anchor="middle" letter-spacing="28" opacity=".55" filter="url(#glow)">AONYX</text>
<text x="614" y="232" font-family="Orbitron, Rajdhani, 'Segoe UI', Arial, sans-serif" font-size="132" font-weight="800" fill="url(#word)" text-anchor="middle" letter-spacing="28">AONYX</text>
<rect x="250" y="264" width="170" height="1.5" fill="url(#fadeL)"/><rect x="780" y="264" width="170" height="1.5" fill="url(#fadeR)"/>
<text x="604" y="270" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="15" font-weight="400" fill="#5b8cff" text-anchor="middle" letter-spacing="8">neural core // online</text>
<text x="600" y="322" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#9db9ff" text-anchor="middle" >A local-first AI assistant that listens, reasons, acts and remembers.</text>
