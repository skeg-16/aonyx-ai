<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WHIS Orb</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background: transparent;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        .orb-container {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(183,0,255,0.3) 0%, transparent 70%);
            border-radius: 50%;
            border: 2px solid #b700ff;
            box-shadow: 0 0 30px rgba(183,0,255,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: pulse 2s infinite alternate;
        }
        .orb-text {
            font-family: 'Orbitron', sans-serif;
            color: #b700ff;
            font-size: 0.9rem;
            font-weight: 700;
            text-shadow: 0 0 10px #b700ff;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; box-shadow: 0 0 20px rgba(183,0,255,0.4); }
            100% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 40px rgba(183,0,255,0.8); }
        }
    </style>
</head>
<body>
    <div class="orb-container" onclick="expandWhis()">
        <span class="orb-text">W.H.I.S.</span>
    </div>

    <script>
        function expandWhis() {
            if (window.pywebview && window.pywebview.api) {
                window.pywebview.api.trigger_wake();
            }
        }
        
        // Also listen to websockets to trigger expand if voice wakes it up
        const host = window.location.hostname || "127.0.0.1";
        const port = window.location.port || "8000";
        const ws = new WebSocket(`ws://${host}:${port}/ws`);
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === 'state' && data.state !== 'idle') {
                if (window.pywebview && window.pywebview.api) {
                    window.pywebview.api.maximize();
                }
            }
        };
    </script>
</body>
</html>
