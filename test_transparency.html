<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transparency Test</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: transparent; }
        canvas { display: block; width: 100%; height: 100%; background: transparent; }
        #info { position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; text-shadow: 1px 1px 2px black; }
    </style>
    <!-- Import Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Testing Transparency...</div>
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        document.getElementById('info').innerText = 'Modules Loaded.\nPrefers-reduced-motion: ' + window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, premultipliedAlpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x000000, 0); // Transparent!
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        // Glowing Core
        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x083fc3 });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Bloom Postprocessing
        const renderScene = new RenderPass(scene, camera);
        renderScene.clearColor = new THREE.Color(0, 0, 0);
        renderScene.clearAlpha = 0;

        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0;
        bloomPass.strength = 2.0;
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        let start = Date.now();
        let frames = 0;

        function animate() {
            requestAnimationFrame(animate);
            sphere.rotation.y += 0.01;
            sphere.rotation.x += 0.01;
            
            // Pulsing effect
            const scale = 1 + Math.sin(Date.now() * 0.003) * 0.1;
            sphere.scale.set(scale, scale, scale);

            composer.render();
            
            frames++;
            if (Date.now() - start > 1000) {
                document.getElementById('info').innerText = `FPS: ${frames}\nReduced Motion: ${window.matchMedia('(prefers-reduced-motion: reduce)').matches}`;
                frames = 0;
                start = Date.now();
            }
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
