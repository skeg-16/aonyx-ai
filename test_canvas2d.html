<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canvas 2D Glow Spike</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background-color: transparent; }
        .canvas-container {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
        }
        canvas {
            filter: drop-shadow(0 0 20px rgba(8, 63, 195, 0.8)) drop-shadow(0 0 40px rgba(47, 107, 255, 0.5));
        }
        .glow-bg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(8, 63, 195, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="canvas-container">
        <canvas id="c"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d', { alpha: true });
        canvas.width = 400; canvas.height = 400;

        let angle = 0;
        function draw() {
            requestAnimationFrame(draw);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            
            // Outer dashed ring
            ctx.beginPath();
            ctx.arc(0, 0, 150, 0, Math.PI * 2);
            ctx.strokeStyle = '#2f6bff';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 15]);
            ctx.stroke();

            // Inner solid core
            ctx.beginPath();
            ctx.arc(0, 0, 40 + Math.sin(angle * 5) * 5, 0, Math.PI * 2);
            ctx.fillStyle = '#cfe0ff';
            ctx.shadowColor = '#5b8cff';
            ctx.shadowBlur = 20;
            ctx.fill();

            ctx.restore();
            angle += 0.02;
        }
        draw();
    </script>
</body>
</html>
