<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-label="Aonyx state machine" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Aonyx state machine</title>
<defs>
<linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#052a82" stop-opacity=".55"/><stop offset="1" stop-color="#031a52" stop-opacity=".9"/></linearGradient>
<linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#083fc3" stop-opacity=".05"/><stop offset=".5" stop-color="#083fc3" stop-opacity=".45"/><stop offset="1" stop-color="#083fc3" stop-opacity=".05"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2f6bff" stroke-opacity=".07"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b8cff"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3b4e"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#5b8cff"/></marker>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<style>
.flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
</style>
</defs>
<rect width="1200" height="372" rx="14" fill="#010714"/>
<rect width="1200" height="372" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="371" rx="14" fill="none" stroke="#083fc3" stroke-opacity=".55"/>
<polygon points="40,80 188,80 200,92 200,154 52,154 40,142" fill="url(#nodeFill)" stroke="#2f6bff" stroke-width="1.5"/>
<text x="120.0" y="114" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#cfe0ff" text-anchor="middle" >IDLE</text>
<text x="120.0" y="135" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >slow breathing</text>
<polygon points="280,80 428,80 440,92 440,154 292,154 280,142" fill="url(#nodeFill)" stroke="#5b8cff" stroke-width="1.5"/>
<text x="360.0" y="114" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#cfe0ff" text-anchor="middle" >LISTENING</text>
<text x="360.0" y="135" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >reacts to mic level</text>
<polygon points="520,80 668,80 680,92 680,154 532,154 520,142" fill="url(#nodeFill)" stroke="#5b8cff" stroke-width="1.5"/>
<text x="600.0" y="114" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#cfe0ff" text-anchor="middle" >THINKING</text>
<text x="600.0" y="135" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >filaments converge</text>
<polygon points="760,80 908,80 920,92 920,154 772,154 760,142" fill="url(#nodeFill)" stroke="#9db9ff" stroke-width="1.5"/>
<text x="840.0" y="114" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#cfe0ff" text-anchor="middle" >TOOL_EXECUTION</text>
<text x="840.0" y="135" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >scanning sweep</text>
<polygon points="1000,80 1148,80 1160,92 1160,154 1012,154 1000,142" fill="url(#nodeFill)" stroke="#cfe0ff" stroke-width="1.5"/>
<text x="1080.0" y="114" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#cfe0ff" text-anchor="middle" >SPEAKING</text>
<text x="1080.0" y="135" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >ripples with speech</text>
<path d="M202 117.0H276" fill="none" stroke="#5b8cff" stroke-width="1.6" class="flow" marker-end="url(#arr)"/>
<path d="M442 117.0H516" fill="none" stroke="#5b8cff" stroke-width="1.6" class="flow" marker-end="url(#arr)"/>
<path d="M682 117.0H756" fill="none" stroke="#5b8cff" stroke-width="1.6" class="flow" marker-end="url(#arr)"/>
<path d="M922 117.0H996" fill="none" stroke="#5b8cff" stroke-width="1.6" class="flow" marker-end="url(#arr)"/>
<path d="M860.0 78C860.0 18 580.0 18 580.0 76" fill="none" stroke="#9db9ff" stroke-width="1.6" class="flow" marker-end="url(#arr)"/>
<text x="720.0" y="30" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >repeat while tools are needed</text>
<path d="M1080.0 156V184H120.0V158" fill="none" stroke="#5b8cff" stroke-width="1.6" class="flow" marker-end="url(#arr)"/>
<text x="236" y="176" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >response finished, back to idle</text>
<polygon points="520,246 668,246 680,258 680,312 532,312 520,300" fill="#ff3b4e" fill-opacity=".10" stroke="#ff3b4e" stroke-width="1.6"/>
<text x="600.0" y="276" font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace" font-size="14" font-weight="700" fill="#ffd9dd" text-anchor="middle" >ERROR</text>
<text x="600.0" y="296" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ff8d99" text-anchor="middle" >red glitch, then settles</text>
<path d="M600.0 158V242" fill="none" stroke="#ff3b4e" stroke-width="1.6" class="flow" marker-end="url(#arrRed)"/>
<path d="M840.0 158V216H640.0V242" fill="none" stroke="#ff3b4e" stroke-width="1.6" class="flow" marker-end="url(#arrRed)"/>
<path d="M360.0 158V279.0H516" fill="none" stroke="#ff3b4e" stroke-width="1.6" class="flow" marker-end="url(#arrRed)"/>
<path d="M600.0 314V342H80V158" fill="none" stroke="#9db9ff" stroke-width="1.6" class="flow" marker-end="url(#arr)"/>
<text x="330" y="334" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >any failure shows a plain message and a retry, then recovers to idle</text>
</svg>
