<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Aonyx security gates between the model and any action" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Aonyx security gates between the model and any action</title>
<defs>
<linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#052a82" stop-opacity=".55"/><stop offset="1" stop-color="#031a52" stop-opacity=".9"/></linearGradient>
<linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#083fc3" stop-opacity=".05"/><stop offset=".5" stop-color="#083fc3" stop-opacity=".45"/><stop offset="1" stop-color="#083fc3" stop-opacity=".05"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2f6bff" stroke-opacity=".07"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b8cff"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff3b4e"/></marker>
<marker id="arrS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10z" fill="#5b8cff"/></marker>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<style>
.flow{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}}
</style>
</defs>
<rect width="1200" height="350" rx="14" fill="#010714"/>
<rect width="1200" height="350" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="1199" height="349" rx="14" fill="none" stroke="#083fc3" stroke-opacity=".55"/>
<text x="600" y="44" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9db9ff" text-anchor="middle" >A tool call has to pass every gate before anything runs</text>
<polygon points="40,70 180,70 190,80 190,142 50,142 40,132" fill="url(#nodeFill)" stroke="#2f6bff" stroke-width="1.2"/>
<text x="115.0" y="108.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#cfe0ff" text-anchor="middle" >Model</text>
<text x="115.0" y="130.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >requests a tool</text>
<polygon points="212,70 388,70 408,106.0 388,142 212,142 232,106.0" fill="url(#nodeFill)" stroke="#2f6bff" stroke-width="1.4"/>
<text x="314.0" y="105.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#cfe0ff" text-anchor="middle" >Schema check</text>
<text x="314.0" y="125.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9db9ff" text-anchor="middle" >arguments validated</text>
<path d="M314.0 146V196" fill="none" stroke="#ff3b4e" stroke-width="1.4" class="flow" marker-end="url(#arrRed)"/>
<polygon points="414,70 590,70 610,106.0 590,142 414,142 434,106.0" fill="url(#nodeFill)" stroke="#2f6bff" stroke-width="1.4"/>
<text x="516.0" y="105.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#cfe0ff" text-anchor="middle" >Allowlist</text>
<text x="516.0" y="125.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9db9ff" text-anchor="middle" >known tools, apps, paths</text>
<path d="M516.0 146V196" fill="none" stroke="#ff3b4e" stroke-width="1.4" class="flow" marker-end="url(#arrRed)"/>
<polygon points="616,70 792,70 812,106.0 792,142 616,142 636,106.0" fill="url(#nodeFill)" stroke="#2f6bff" stroke-width="1.4"/>
<text x="718.0" y="105.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#cfe0ff" text-anchor="middle" >Permission</text>
<text x="718.0" y="125.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9db9ff" text-anchor="middle" >safe, confirm or blocked</text>
<path d="M718.0 146V196" fill="none" stroke="#ff3b4e" stroke-width="1.4" class="flow" marker-end="url(#arrRed)"/>
<polygon points="818,70 994,70 1014,106.0 994,142 818,142 838,106.0" fill="url(#nodeFill)" stroke="#ffb020" stroke-width="1.4"/>
<text x="920.0" y="105.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#cfe0ff" text-anchor="middle" >Confirmation</text>
<text x="920.0" y="125.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9db9ff" text-anchor="middle" >approve in the HUD</text>
<path d="M920.0 146V196" fill="none" stroke="#ff3b4e" stroke-width="1.4" class="flow" marker-end="url(#arrRed)"/>
<polygon points="1050,70 1150,70 1160,80 1160,142 1060,142 1050,132" fill="url(#nodeFill)" stroke="#5b8cff" stroke-width="1.6"/>
<text x="1105.0" y="108.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#cfe0ff" text-anchor="middle" >Run</text>
<text x="1105.0" y="130.0" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >tool executes</text>
<text x="314.0" y="218" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ff8d99" text-anchor="middle" >malformed input is rejected</text>
<text x="516.0" y="218" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ff8d99" text-anchor="middle" >unlisted targets are blocked</text>
<text x="718.0" y="218" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ff8d99" text-anchor="middle" >blocked tools stay hidden</text>
<text x="920.0" y="218" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#ff8d99" text-anchor="middle" >denied or timed out, no run</text>
<rect x="40" y="254" width="1120" height="62" rx="6" fill="url(#barFill)" stroke="#2f6bff" stroke-opacity=".5" stroke-dasharray="4 5"/>
<text x="600" y="280" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#cfe0ff" text-anchor="middle" >Every call is written to a local audit log</text>
<text x="600" y="301" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9db9ff" text-anchor="middle" >tool, arguments, permission result, duration, outcome. File contents and secrets are never logged.</text>
</svg>
